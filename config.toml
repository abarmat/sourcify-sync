# Sourcify Sync Configuration

# URL to the manifest file
manifest_url = "https://export.sourcify.dev/manifest.json"

# Directory where files will be downloaded (flattened)
download_dir = "./downloads"

# Path to aria2c binary
aria2c_path = "aria2c"

# Number of concurrent downloads
concurrent_downloads = 5

# Verify parquet file integrity after download (validates metadata and schema)
integrity_check = true

# Number of times to retry downloading files that fail integrity checks
integrity_retry_count = 3

# Number of concurrent parquet validations (default: CPU count)
# concurrent_validations = 4

# Format version: "v1" (JSON manifest) or "v2" (XML listing with checksums)
# - v1: Uses manifest.json, trusts file existence for completeness
# - v2: Uses GCP XML listing, checksum-based incremental sync
format_version = "v2"

# V2-specific settings (only used when format_version = "v2")
# v2_listing_url = "https://export.sourcify.dev/"
# v2_prefix = "v2/"
